<!DOCTYPE html>
<html lang="en">
<head>
  
  <!--
  Shared head of the viewer pages; each page sets its title first (Kit
  variable "title"). Same JS as the app (../app-min.js). No theme switch:
  the viewer follows the system (light / dark).
-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MOTOOOR · Call sheet - Talent Calls</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="viewer.css">
  <script src="../app-min.js" defer></script>

</head>

<body class="viewer">

  <!-- Cover image of the project, blurred behind the top of every page -->
<div class="viewer__cover bg_08" aria-hidden="true"></div>

  <!--
  Menu: a button at the top left (over the cover) opens the sections full
  screen, with the Motooor logo; its close button sits in the same place.
  Opened like the bottom sheets (data-sheet, js/app.js "Bottom sheet");
  app.js marks the open page (.is-current). CSS: MENU, viewer/_mobile.scss.
-->
<button class="viewer__menu card__action icon icon__menu" type="button" aria-label="Menu" aria-haspopup="dialog" data-sheet="viewer-menu"></button>
<dialog class="viewer-menu" id="viewer-menu" aria-label="Menu">
  <form class="viewer-menu__panel" method="dialog">
    <button class="viewer-menu__close card__action icon icon__close-alt" value="close" aria-label="Close menu"></button>
    <span class="viewer-menu__logo" role="img" aria-label="Motooor"></span>
    <nav class="viewer-menu__nav" aria-label="Call sheet">
      <a class="viewer-menu__item icon icon__home" href="index.html">Home</a>
      <a class="viewer-menu__item icon icon__shoot-plan" href="shoot-plan.html">Shoot Plan</a>
      <a class="viewer-menu__item icon icon__cast" href="cast-calls.html">Talent Calls</a>
      <a class="viewer-menu__item icon icon__crew" href="crew-calls.html">Crew Calls</a>
    </nav>
    <p class="viewer-menu__footer">© Motooor 2026</p>
  </form>
</dialog>

  <!--
    Talent details, as a bottom sheet: a row's button (data-sheet) copies its
    <template> into [data-sheet-body] and opens it (js/app.js, "Bottom sheet").
    CSS: .sheet and .talent, viewer/_mobile.scss.
  -->
  <dialog class="sheet" id="talent-sheet" aria-labelledby="talent-sheet-title">
    <form class="sheet__panel" method="dialog">
      <header class="sheet__header">
        <h2 class="sheet__title" id="talent-sheet-title">Details</h2>
        <button class="card__action icon icon__close-alt" value="close" aria-label="Close"></button>
      </header>
      <div class="sheet__body" data-sheet-body></div>
      <footer class="sheet__footer">
        <button class="sheet__button" value="done">Done</button>
      </footer>
    </form>
  </dialog>

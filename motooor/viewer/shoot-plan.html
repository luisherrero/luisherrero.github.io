<!DOCTYPE html>
<html lang="en">
<head>
  <!--
      Shared head of the viewer pages; each page sets its title first (Kit
      variable "title"). Same JS as the app (../app-min.js). No theme switch:
      the viewer follows the system (light / dark).
    -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <title>MOTOOOR · Call sheet - Shoot Plan</title>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
      <link rel="stylesheet" href="viewer.css">
      <script src="../app-min.js" defer></script>
    
</head>

<body class="viewer">

  <!-- Cover image of the project, blurred behind the top of every page -->
  <div class="viewer__cover bg_08" aria-hidden="true"></div>
  
  <!--
            Page title over the cover and one button on its right. Each page sets the
            Kit variables first: title, bar-icon (icon name), bar-label (the button's
            name) and bar-sheet (id of the bottom sheet it opens; "none" = no action yet).
          -->
          <header class="viewer__bar">
            <h1>Shoot Plan</h1>
            <button class="card__action icon icon__overflow" type="button" aria-label="More" data-sheet="none"></button>
          </header>
          

  <main class="viewer__content">

    <!-- Days: a tab per day and, under it, that day's card: figures, then shots (app.js, "Tabs") -->
    <div class="days">
      <div class="days__tabs" role="tablist" aria-label="Shooting days">
        <button class="days__tab" type="button" role="tab" id="day-1-tab" aria-controls="day-1" aria-selected="true">Day 1 · Tue 29</button>
        <button class="days__tab" type="button" role="tab" id="day-2-tab" aria-controls="day-2" aria-selected="false">Day 2 · Wed 30</button>
      </div>

            <dt>Call → wrap</dt>

          </div>
          <div class="stats__item"><dt>Shooting</dt><dd>17h 20m</dd></div>
          <div class="stats__item"><dt>Shots</dt><dd>52</dd></div>
        </dl>

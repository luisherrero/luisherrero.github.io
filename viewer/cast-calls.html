<!DOCTYPE html>
<html lang="en">
<head>
  <!--
      Shared head of the viewer pages; each page sets its title first (Kit
      variable "title"). JS: viewer-min.js (CodeKit builds it from viewer.js;
      the viewer does not load the app's app.js). No theme switch:
      the viewer follows the system (light / dark).
    -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <title>MOTOOOR · Call sheet - Talent Calls</title>
      <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)">
      <meta name="theme-color" content="#161b1e" media="(prefers-color-scheme: dark)">
      <!--
        Favicons and home-screen icons (masters: MOTOOOR/Assets, from _isotipo.svg).
        Files in production/viewer/images/favicon/ (the viewer folder stays self-contained). Android / Chrome read site.webmanifest (192 and 512);
        old Windows tiles read the msapplication-* meta tags.
      -->
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">

<!--
  Talent Calls (Figma › Viewer › Talent Calls). The bar with the page name;
  the project image; then a card per call group: a row per person
  (character · artist · set call; tablets: the five times instead). A row
  opens the person's details (its <template>, title from data-title) in
  #talent-sheet. CSS: _calls.scss, _lists.scss (CALLS), _sheet.scss.
-->

  <!-- The project image under the bar, darkened (as Shoot Plan, without figures) -->
  <div class="figures figures--plain" aria-hidden="true">
    <img class="figures__img" src="images/bg_project.webp" alt="" width="1600" height="1000" fetchpriority="high" decoding="async">
  </div>

              <div><dt>Shots</dt><dd>The Moty Job · 5</dd></div>
            </dl>
            <p class="talent__notes">Trae su propio vestuario de entrenamiento.</p>
          </template>
        </li>
      </ul>
    </section>
  </main>

<!DOCTYPE html>

      Shared head of the viewer pages; each page sets its title first (Kit
      variable "title"). Same JS as the app: app-min.js, a copy of ../app-min.js (copy it again after changing js/app.js). No theme switch:
      the viewer follows the system (light / dark).
    -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <title>MOTOOOR · Call sheet - Talent Calls</title>
      <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)">
      <meta name="theme-color" content="#161b1e" media="(prefers-color-scheme: dark)">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
      <link rel="stylesheet" href="viewer.css">
      <script src="app-min.js" defer></script>
    
</head>

    <header class="shot-sheet__head" data-sheet-grip>
      <h2 class="shot-sheet__title" id="talent-sheet-title"></h2>
      <button class="shot-sheet__close icon icon__close-alt" type="button" aria-label="Close" data-sheet-close></button>

    </div>
  </dialog>

  <footer class="viewer__footer">© Motooor 2026</footer>
  
  <!--
      Navigation: a round button always on screen (bottom right by default; the
      page sets data-menu on <body>) opens the sections full screen over a
      blurred veil: the Motooor logo and a link per page. The dialog has its own
      button in the very same place, whose three lines turn into a cross; the
      logo, the sections and the © line come in one after another. js/app.js
      "Viewer navigation" opens and closes it (Esc too) and marks the open page
      (.is-current). CSS: NAVIGATION, viewer/_mobile.scss.
    -->
    <button class="fab" type="button" aria-label="Menu" aria-haspopup="dialog" aria-controls="viewer-menu" data-nav-open><span class="fab__lines" aria-hidden="true"></span></button>
    <dialog class="viewer-menu" id="viewer-menu" aria-label="Menu">
      <nav class="viewer-menu__nav" aria-label="Call sheet">
        <span class="viewer-menu__logo" role="img" aria-label="Motooor"></span>
        <a class="viewer-menu__item icon icon__home" href="index.html">Home</a>
        <a class="viewer-menu__item icon icon__shoot-plan" href="shoot-plan.html">Shoot Plan</a>

        <a class="viewer-menu__item icon icon__crew" href="crew-calls.html">Crew Calls</a>
      </nav>
      <p class="viewer-menu__footer">© Motooor 2026</p>
      <button class="fab fab--close" type="button" aria-label="Close menu" data-nav-close autofocus><span class="fab__lines" aria-hidden="true"></span></button>
    </dialog>

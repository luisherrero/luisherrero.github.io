<!DOCTYPE html>
<html lang="en">
<head>
  <!--
      Shared head of the viewer pages; each page sets its title first (Kit
      variable "title"). Same JS as the app: app-min.js, a copy of ../app-min.js (copy it again after changing js/app.js). No theme switch:
      the viewer follows the system (light / dark).
    -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <title>MOTOOOR · Call sheet - Talent Calls</title>
      <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)">
      <meta name="theme-color" content="#161b1e" media="(prefers-color-scheme: dark)">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
      <link rel="stylesheet" href="viewer.css">
      <script src="app-min.js" defer></script>
    
</head>

<body class="viewer">

  <!--
    Top of every page but Home: the project cover, short, with the page title and
    the day selector (the menu is the round button of kit/_nav.kit). Each page sets the Kit variable title
    first. A page with a button of its own (Crew Calls › Sort options) uses
    kit/_bar-button.kit instead. CSS: PAGE › .viewer__head, viewer/_mobile.scss.
  -->
  <header class="viewer__head bg_08">
    <div class="viewer__tools">
      <h1 class="viewer__title">Talent Calls</h1>
      <!--
        Day selector, on the right of the menu button: the chosen day; it opens the
        days sheet (kit/_day-sheet.kit). js/app.js "Day selector" writes the chosen
        day here ([data-day-label]). CSS: PAGE › .viewer__day, viewer/_mobile.scss.
      -->
      <button class="viewer__day" type="button" aria-haspopup="dialog" data-sheet="day-sheet"><span data-day-label>Day 1</span></button>
      
    </div>
  </header>

  <!--
    Talent details, as a bottom sheet: a row's button (data-sheet) copies its
    <template> into [data-sheet-body] and opens it (js/app.js, "Bottom sheet").
    CSS: .sheet and .talent, viewer/_mobile.scss.
  -->
  <dialog class="sheet sheet--modal sheet--narrow" id="talent-sheet" aria-labelledby="talent-sheet-title">
    <form class="sheet__panel" method="dialog">
      <header class="sheet__header">
        <h2 class="sheet__title" id="talent-sheet-title">Details</h2>
        <button class="card__action icon icon__close-alt" value="close" aria-label="Close"></button>
      </header>
      <div class="sheet__body" data-sheet-body></div>
      <footer class="sheet__footer">
        <button class="sheet__button" value="done">Done</button>
      </footer>
    </form>
  </dialog>

  <!--
    Days of the call sheet: a bottom sheet with a radio per day (as Sort
    options, but no Done: choosing a day closes it), opened by the day selector (kit/_day.kit). The value is the id of
    the day; on Shoot Plan it is also the id of that day's card, which
    js/app.js "Day selector" shows.
  -->
  <dialog class="sheet" id="day-sheet" aria-labelledby="day-sheet-title">
    <form class="sheet__panel" method="dialog">
      <header class="sheet__header">
        <h2 class="sheet__title" id="day-sheet-title">Shooting days</h2>
        <button class="card__action icon icon__close-alt" value="close" aria-label="Close"></button>
      </header>
      <div class="sheet__options" role="radiogroup" aria-labelledby="day-sheet-title">
        <label class="sheet__option"><input type="radio" name="day" value="day-1" data-label="Day 1" checked>Day 1 · Tue 29</label>
        <label class="sheet__option"><input type="radio" name="day" value="day-2" data-label="Day 2">Day 2 · Wed 30</label>
      </div>
    </form>
  </dialog>
  
  <footer class="viewer__footer">© Motooor 2026</footer>
    
  <!--
        Navigation: a round button always on screen (bottom right by default; the
        page sets data-menu on <body>) opens the sections full screen over a
        blurred veil: the Motooor logo and a link per page. The dialog has its own
        button in the very same place, whose three lines turn into a cross; the
        logo, the sections and the © line come in one after another. js/app.js
        "Viewer navigation" opens and closes it (Esc too) and marks the open page

      -->
